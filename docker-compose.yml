name: intern-be

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: magang_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/magang/config/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/magang/Dockerfile
    ports:
      - "8090:8090"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: magang_dev
      DB_SSLMODE: disable
      MAGANG_PORT: 8090
      MAGANG_JWT_SECRET: magang-dev-secret-change-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    external: true
    name: magang-be_pgdata
